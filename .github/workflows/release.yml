name: 构建并发布 Release
run-name: 发布 ${{ github.event.inputs.tag || github.ref_name }} · 构建 APK 与更新说明

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 检查、签名与发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: 核对版本并显示更新内容
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('标签必须使用 v0.0.1 格式')
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'^val verName = "([^"]+)"$', source, re.M).group(1)
          if tag != f'v{version}':
              raise SystemExit('标签与 APK 版本不一致')
          notes = pathlib.Path(f'docs/releases/{version}.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('缺少本版本更新说明')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_VERSION={version}\nRELEASE_NOTES={notes}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(notes.read_text() + '\n')
          print(notes.read_text())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: 恢复发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.PPX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo '缺少 PPX_KEYSTORE_BASE64，停止发布'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ppx-release.keystore"
      - name: 单元测试、Lint 与 Release 构建
        env:
          PPX_KEYSTORE_FILE: ${{ runner.temp }}/ppx-release.keystore
          PPX_STORE_PASSWORD: ${{ secrets.PPX_STORE_PASSWORD }}
          PPX_KEY_ALIAS: ${{ secrets.PPX_KEY_ALIAS }}
          PPX_KEY_PASSWORD: ${{ secrets.PPX_KEY_PASSWORD }}
        run: bash ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console=plain
      - name: 验证 APK 签名并生成校验值
        run: |
          apk="app/build/outputs/release-dist/皮友助手-v${RELEASE_VERSION}-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cd app/build/outputs/release-dist
          mv "皮友助手-v${RELEASE_VERSION}-release.apk" "piyou-assistant-v${RELEASE_VERSION}-release.apk"
          sha256sum *.apk > SHA256SUMS.txt
      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ env.RELEASE_TAG }}
          path: app/build/reports/
          if-no-files-found: ignore
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ppx-assistant-${{ env.RELEASE_TAG }}
          path: app/build/outputs/release-dist/
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "皮友助手 ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES" app/build/outputs/release-dist/*
          printf '\n发布成功：[下载 %s](https://github.com/%s/releases/tag/%s)\n' "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: 清理临时签名
        if: always()
        run: rm -f "$RUNNER_TEMP/ppx-release.keystore"
